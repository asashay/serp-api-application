<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Search Lab architecture: a Cloudflare Worker gates each search, then Rails and a warm Firefox renderer in one container capture Google through a guarded residential proxy.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#28292a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5bd8"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #28292a; stroke-width: 1.5; }
      .shadow { fill: #28292a; }
      .group { fill: none; stroke: #28292a; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .group-label { font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #5b5d60; }
      .name { font-size: 15px; font-weight: 600; fill: #28292a; }
      .detail { font-size: 12.5px; fill: #44474b; }
      .mono { font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #2f5bd8; }
      .edge { font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #28292a; }
      .line { stroke: #28292a; stroke-width: 1.5; fill: none; }
      .line-blue { stroke: #2f5bd8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .accent { fill: #a9c1ff; stroke: #28292a; stroke-width: 1.5; }
      .external { fill: #eef2ff; stroke: #28292a; stroke-width: 1.5; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; fill: #28292a; }
      .note-head { font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #28292a; }
      .note { font-size: 12.5px; fill: #28292a; }
    </style>
  </defs>

  <rect width="1000" height="640" fill="#f7f4ef"/>
  <text x="40" y="46" class="title">Search Lab: <tspan font-style="italic">request path</tspan></text>
  <text x="960" y="46" text-anchor="end" class="group-label">ONE LIVE SEARCH = ONE ADMITTED ATTEMPT</text>

  <!-- Client -->
  <rect x="44" y="114" width="180" height="76" class="shadow"/>
  <rect x="40" y="110" width="180" height="76" class="accent"/>
  <text x="56" y="138" class="name">Browser / API client</text>
  <text x="56" y="158" class="detail">playground or curl</text>
  <text x="56" y="176" class="mono">GET /search.json</text>

  <!-- Cloudflare edge -->
  <rect x="262" y="80" width="250" height="236" class="group"/>
  <text x="274" y="98" class="group-label">CLOUDFLARE EDGE</text>

  <rect x="284" y="114" width="210" height="76" class="shadow"/>
  <rect x="280" y="110" width="210" height="76" class="box"/>
  <text x="296" y="138" class="name">Worker</text>
  <text x="296" y="158" class="detail">validates q + location first</text>
  <text x="296" y="176" class="detail">routes API and playground</text>

  <rect x="284" y="228" width="210" height="72" class="shadow"/>
  <rect x="280" y="224" width="210" height="72" class="box"/>
  <text x="296" y="250" class="name">SearchGate</text>
  <text x="296" y="268" class="detail">Durable Object, one global gate</text>
  <text x="296" y="286" class="detail">10–15 s cooldown · 400 / month</text>

  <line x1="370" y1="190" x2="370" y2="222" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="380" y="210" class="edge">reserve</text>

  <line x1="222" y1="136" x2="278" y2="136" class="line" marker-end="url(#arrow)"/>
  <line x1="278" y1="170" x2="224" y2="170" class="line-blue" marker-end="url(#arrow-blue)"/>

  <!-- Container -->
  <rect x="548" y="80" width="412" height="372" class="group"/>
  <text x="560" y="98" class="group-label">CLOUDFLARE CONTAINER · 1 GIB · KEPT WARM</text>

  <rect x="572" y="114" width="370" height="96" class="shadow"/>
  <rect x="568" y="110" width="370" height="96" class="box"/>
  <text x="584" y="136" class="name">Rails 8 · Puma :3000</text>
  <text x="584" y="156" class="detail">Query → Google URL with hl, gl and uule</text>
  <text x="584" y="174" class="detail">Parser → SerpApi-style JSON (Nokogiri)</text>
  <text x="584" y="192" class="detail">Preview → sanitized, link-free page copy</text>

  <rect x="572" y="248" width="370" height="96" class="shadow"/>
  <rect x="568" y="244" width="370" height="96" class="box"/>
  <text x="584" y="270" class="name">Python renderer :3800</text>
  <text x="584" y="290" class="detail">warm Invisible Playwright Firefox, fresh context</text>
  <text x="584" y="308" class="detail">removes consent dialog · resolves /goto links</text>
  <text x="584" y="326" class="detail">challenge → retry on a new exit IP (×3)</text>

  <rect x="572" y="374" width="370" height="62" class="shadow"/>
  <rect x="568" y="370" width="370" height="62" class="box"/>
  <text x="584" y="395" class="name">CONNECT guard :3801</text>
  <text x="584" y="415" class="detail">Google hosts only · adds proxy credentials</text>

  <line x1="492" y1="136" x2="566" y2="136" class="line" marker-end="url(#arrow)"/>
  <line x1="566" y1="170" x2="494" y2="170" class="line-blue" marker-end="url(#arrow-blue)"/>
  <text x="497" y="128" class="edge">POST</text>
  <text x="495" y="194" class="edge" font-size="9.5">/capture</text>

  <line x1="753" y1="206" x2="753" y2="242" class="line" marker-end="url(#arrow)"/>
  <text x="763" y="229" class="edge">POST 127.0.0.1:3800/render</text>

  <line x1="753" y1="340" x2="753" y2="368" class="line" marker-end="url(#arrow)"/>
  <text x="763" y="359" class="edge">Firefox traffic</text>

  <!-- External -->
  <rect x="572" y="504" width="170" height="80" class="shadow"/>
  <rect x="568" y="500" width="170" height="80" class="external"/>
  <text x="584" y="526" class="name">DataImpulse</text>
  <text x="584" y="546" class="detail">residential gateway</text>
  <text x="584" y="566" class="mono">city + session id</text>

  <rect x="794" y="504" width="148" height="80" class="shadow"/>
  <rect x="790" y="500" width="148" height="80" class="external"/>
  <text x="806" y="526" class="name">Google</text>
  <text x="806" y="546" class="detail">www.google.com</text>
  <text x="806" y="566" class="mono">/search</text>

  <line x1="653" y1="432" x2="653" y2="498" class="line" marker-end="url(#arrow)"/>
  <text x="663" y="470" class="edge">authenticated CONNECT</text>
  <line x1="740" y1="540" x2="788" y2="540" class="line" marker-end="url(#arrow)"/>

  <!-- Response path -->
  <line x1="40" y1="222" x2="70" y2="222" class="line-blue"/>
  <text x="78" y="226" class="mono">JSON response</text>
  <text x="40" y="246" class="mono">+ preview_html in the</text>
  <text x="40" y="262" class="mono">playground</text>

  <!-- Notes -->
  <rect x="40" y="356" width="472" height="228" fill="#ffffff" stroke="#28292a" stroke-width="1.2"/>
  <text x="58" y="382" class="note-head">DESIGN CHOICES</text>
  <text x="58" y="408" class="note">• Bad input and rate limits are rejected before any quota or traffic.</text>
  <text x="58" y="434" class="note">• Rails and Firefox share a container: the renderer is loopback-only.</text>
  <text x="58" y="460" class="note">• Destinations are checked three times: URL builder, route</text>
  <text x="70" y="477" class="note">filter and CONNECT guard.</text>
  <text x="58" y="503" class="note">• The parser reads saved HTML with no browser or network,</text>
  <text x="70" y="520" class="note">so it is tested against real captured pages.</text>
  <text x="58" y="546" class="note">• config/locations.json is shared by the Worker, Rails and the</text>
  <text x="70" y="563" class="note">renderer, so the three never disagree about a place.</text>
</svg>
