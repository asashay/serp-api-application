[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:renderer]
command=/opt/renderer/bin/python /app/renderer/server.py
environment=INVPW_TRUE_HEADLESS="1"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rails]
command=bundle exec puma -C config/puma.rb
environment=DATAIMPULSE_SERVER="",DATAIMPULSE_USERNAME="",DATAIMPULSE_PASSWORD=""
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
